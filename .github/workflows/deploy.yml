# Publishes the site to Cloudflare whenever main changes.
# Needs one repository secret: CLOUDFLARE_API_TOKEN (Settings → Secrets and variables → Actions).
name: Deploy website
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: deploy-website
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Check the menu page is up to date with data/menu.json
        run: node scripts/build-menu.mjs && git diff --exit-code site/index.html
      - name: Deploy to Cloudflare
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: npx wrangler deploy
